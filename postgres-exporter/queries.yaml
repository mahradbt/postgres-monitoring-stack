pg_replication_slots:
  query: |
    SELECT
      slot_name,
      slot_type,
      active::int AS active,
      COALESCE(pg_wal_lsn_diff(pg_current_wal_lsn(), restart_lsn), 0) AS retained_bytes
    FROM pg_replication_slots
  metrics:
    - slot_name:
        usage: "LABEL"
        description: "Replication slot name"
    - slot_type:
        usage: "LABEL"
        description: "physical or logical"
    - active:
        usage: "GAUGE"
        description: "1 means the slot is currently in use by a standby/subscriber"
    - retained_bytes:
        usage: "GAUGE"
        description: "Amount of WAL retained because of this slot (bytes). Continuous growth means the consumer is falling behind"

pg_stat_subscription_detail:
  query: |
    SELECT
      s.subname,
      d.datname AS database,
      (s.pid IS NOT NULL)::int AS worker_running,
      COALESCE(EXTRACT(EPOCH FROM (now() - s.last_msg_receipt_time)), 0) AS seconds_since_last_msg,
      COALESCE(EXTRACT(EPOCH FROM (s.last_msg_receipt_time - s.last_msg_send_time)), 0) AS reported_lag_seconds
    FROM pg_stat_subscription s
    JOIN pg_subscription sub ON sub.oid = s.subid
    JOIN pg_database d ON d.oid = sub.subdbid
    WHERE s.relid IS NULL
  metrics:
    - subname:
        usage: "LABEL"
        description: "Subscription name"
    - database:
        usage: "LABEL"
        description: "Database the subscription belongs to"
    - worker_running:
        usage: "GAUGE"
        description: "1 if the subscription's apply worker is currently running"
    - seconds_since_last_msg:
        usage: "GAUGE"
        description: "Seconds since this subscriber last received a message from the publisher"
    - reported_lag_seconds:
        usage: "GAUGE"
        description: "Time gap between when the publisher sent and this subscriber received the last message"

pg_stat_archiver_detail:
  query: |
    SELECT
      archived_count,
      failed_count,
      COALESCE(EXTRACT(EPOCH FROM (now() - last_archived_time)), 0) AS seconds_since_last_archive
    FROM pg_stat_archiver
  metrics:
    - archived_count:
        usage: "COUNTER"
        description: "Total number of WAL segments archived"
    - failed_count:
        usage: "COUNTER"
        description: "Number of failed attempts to archive WAL"
    - seconds_since_last_archive:
        usage: "GAUGE"
        description: "Seconds elapsed since the last successful WAL archive"
